<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Student Expenses Tracker </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Student Expense Tracker</h1>
    <p class="intro">Keep track of your daily spending.</p>

    <section class="form-box">
      <h2>Add an Expense</h2>
      <form id="expenseForm">
        <label for="expenseName">Expense name</label>
        <input type="text" id="expenseName" placeholder="e.g. Lunch" required>
        <label for="expenseAmount">Amount</label>
        <input type="number" id="expenseAmount" placeholder="e.g. 120" min="0" step="0.01" required>
        <button type="submit">Add Expense</button>
      </form>
    </section>

    <section class="expenses-box">
      <h2>Expenses</h2>
      <ul id="expenseList"></ul>
      <p class="total">Total: <strong id="totalAmount">0.00</strong></p>
    </section>
  </main>

  <script src="code.js"></script>
</body>
</html>
